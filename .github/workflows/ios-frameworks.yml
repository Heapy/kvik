name: iOS frameworks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-frameworks:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          architecture: aarch64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-disabled: true
      - name: Prepare Apple tools
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          python -m pip install jsonschema==4.23.0
          curl --fail --location --retry 3 \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.20/kotlin-native-prebuilt-macos-aarch64-2.4.20.tar.gz \
            --output "$RUNNER_TEMP/kotlin-native.tar.gz"
          echo "b70d4fd2855fdb054fc9604beaa7de83c18d786454ae948de72a226e81f07dc8  $RUNNER_TEMP/kotlin-native.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/kotlin-native.tar.gz" -C "$RUNNER_TEMP"
          echo "KONAN_HOME=$RUNNER_TEMP/kotlin-native-prebuilt-macos-aarch64-2.4.20" >> "$GITHUB_ENV"
      - name: Prepare pinned Kotlin Toolchain consumer wrapper
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/Heapy/kotaml/a5c94c77b220cfc7b6335668766e8f26930968c3/kotlin \
            --output "$RUNNER_TEMP/kotlin"
          echo "8e5972c57ee6cb277ea3ec48a7b5ace1f19983e5f4373f3f29752b31082d340b  $RUNNER_TEMP/kotlin" | shasum -a 256 --check
      - name: Build runtime and verify Apple frameworks, documentation, task effects and publication consumers
        run: |
          python tools/macos/verify.py --java-home "$JAVA_HOME" --konan-home "$KONAN_HOME" \
            --pin-tools --bootstrap-command-timeout 900 \
            --gradle "$(command -v gradle)" --ktc "$RUNNER_TEMP/kotlin"
      - name: Retain Native publication consumer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-publication-consumers
          path: |
            .kvik/tests/native-publication-cli/case-*/**/*.log
            .kvik/tests/native-publication-cli/case-*/maven-publication/case-*/summary.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Retain Native documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-documentation-logs
          path: |
            .kvik/tests/documentation-cli/case-*/*.jsonl
            .kvik/tests/documentation-cli/case-*/*.stderr
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Retain task-effects compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-task-effects-logs
          path: |
            .kvik/tests/task-effects-cli/case-*/*.jsonl
            .kvik/tests/task-effects-cli/case-*/*.stderr
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Retain native bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-bootstrap-logs
          path: .kvik/runtime/logs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
