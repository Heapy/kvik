name: Linux host runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check cross-machine CI harness
        run: python3 -m unittest discover -s tools -p 'test_*cross_machine*unit.py'
      - name: Check source-workflow comparison gates
        run: python3 -m unittest discover -s tools -p 'test_source_comparison_unit.py'
      - name: Check parallel measurement arithmetic
        run: python3 -m unittest discover -s tools -p 'test_parallel_measurement_unit.py'
      - name: Check container result export
        run: python3 -m unittest discover -s tools -p 'test_linux_export_unit.py'
      - name: Check agent-comparison accounting and failure gates
        run: python3 -m unittest discover -s tools -p 'test_agent_comparison_unit.py'
      - name: Prepare Linux tools
        run: docker build --platform linux/amd64 --tag kvik-linux-host tools/linux
      - name: Build runtime and run JVM and Native fixtures
        run: |
          docker run --rm --init --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/work/kvik" kvik-linux-host \
            sh -ec 'python3 tools/linux/provision_system.py --system-root /usr
                    python3 tools/linux/verify.py --pin-tools --remote-cache-backend /usr/local/bin/bazel-remote'
      - name: Retain serial and default-parallel measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-parallelism-linux
          path: .kvik/ci-artifacts/parallel-comparison.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain foreground compiler session checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-sessions-linux
          path: |
            .kvik/ci-artifacts/foreground-jvm
            .kvik/ci-artifacts/compiler-session-worker
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain cache invalidation checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-invalidation-linux
          path: .kvik/ci-artifacts/cache-invalidation
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain cold local remote and edited build measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-linux
          path: .kvik/ci-artifacts/build-performance
          include-hidden-files: true
          if-no-files-found: ignore
