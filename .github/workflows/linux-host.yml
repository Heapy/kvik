name: Linux host runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check cross-machine CI harness
        run: python3 -m unittest discover -s tools -p 'test_*cross_machine*unit.py'
      - name: Check source-workflow comparison gates
        run: python3 -m unittest discover -s tools -p 'test_source_comparison_unit.py'
      - name: Check workspace-agent comparison grading without model calls
        run: python3 -m unittest discover -s tools -p 'test_workspace_agent_*.py'
      - name: Check parallel measurement arithmetic
        run: python3 -m unittest discover -s tools -p 'test_parallel_measurement_unit.py'
      - name: Check container result export
        run: python3 -m unittest discover -s tools -p 'test_linux_export_unit.py'
      - name: Check bootstrap timing boundaries and source selection
        run: python3 -m unittest discover -s tests/bootstrap -p 'test_build_timings.py'
      - name: Check complete tool inventory traversal
        run: python3 -m unittest discover -s tests/bootstrap -p 'test_inventory.py'
      - name: Check canonical bootstrap identity bytes
        run: python3 -m unittest discover -s tests/bootstrap -p 'test_identity.py'
      - name: Check JVM worker bundle cache
        run: python3 -m unittest discover -s tests/bootstrap -p 'test_worker_cache.py'
      - name: Check source bootstrap worker reuse assertions
        run: python3 -m unittest discover -s tools -p 'test_source_worker_cache_unit.py'
      - name: Check source bootstrap archive policy and timeout records
        run: python3 -m unittest discover -s tools -p 'test_source_tool_archives_unit.py'
      - name: Check source bootstrap process resource measurements
        run: python3 -m unittest discover -s tools -p 'test_source_bootstrap_resources.py'
      - name: Check bounded HTTPS redirects and transfer deadlines
        run: python3 -m unittest discover -s tests/bootstrap -p 'test_source_http.py'
      - name: Check cached startup and RSS measurements
        run: python3 -m unittest discover -s tests/bootstrap -p 'test_cached_startup.py'
      - name: Check foreground measurements
        run: python3 -m unittest discover -s tools -p 'test_foreground_measurements_unit.py'
      - name: Check agent-comparison accounting and failure gates
        run: python3 -m unittest discover -s tools -p 'test_agent_comparison_unit.py'
      - name: Prepare Linux tools
        run: docker build --platform linux/amd64 --tag kvik-linux-host tools/linux
      - name: Build runtime and run JVM and Native fixtures
        run: |
          docker run --rm --init --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/work/kvik" kvik-linux-host \
            sh -ec 'python3 -m unittest discover -s tools -p test_foreground_applications_cli_unit.py
                    python3 tools/linux/provision_system.py --system-root /usr
                    python3 tools/linux/verify.py --pin-tools --remote-cache-backend /usr/local/bin/bazel-remote'
      - name: Retain serial and default-parallel measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-parallelism-linux
          path: .kvik/ci-artifacts/parallel-comparison.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain foreground compiler session checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-sessions-linux
          path: |
            .kvik/ci-artifacts/foreground-jvm
            .kvik/ci-artifacts/compiler-session-worker
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain cache invalidation checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-invalidation-linux
          path: .kvik/ci-artifacts/cache-invalidation
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain cold local remote and edited build measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-linux
          path: .kvik/ci-artifacts/build-performance
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain cached startup and Native RSS samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cached-startup-linux
          path: .kvik/ci-artifacts/cached-startup
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Retain unavailable-target verification checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unavailable-target-linux
          path: .kvik/ci-artifacts/unavailable-target
          include-hidden-files: true
          if-no-files-found: ignore
